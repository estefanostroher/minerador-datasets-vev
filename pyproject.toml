[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "robo-minerador"
version = "0.1.0"
description = "Reproducible miner of documented TypeScript functions and tests"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.11.7",
  "typer==0.16.0",
  "httpx==0.28.1",
  "docker==7.1.0",
  "jsonschema==4.24.0",
  "semantic-version==2.10.0",
  "PyYAML==6.0.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "respx==0.22.0",
  "ruff==0.12.2",
  "mypy==1.16.1",
  "types-docker==7.2.0.20261006",
  "types-jsonschema==4.26.0.20261006",
  "types-PyYAML==6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--strict-markers"
markers = ["docker: requires a working Docker daemon"]

[tool.hatch.build.targets.wheel]
packages = ["src/robo_minerador"]
artifacts = ["src/robo_minerador/state/migrations/*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/robo_minerador"]
plugins = ["pydantic.mypy"]
