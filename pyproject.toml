[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-minerador"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyGithub>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
robo-minerador = "robo_minerador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["robo_minerador.typescript*"]

[tool.setuptools.package-data]
robo_minerador = ["validation_recipes.json", "validation_resource_models.json", "validation_resource_local_models.json", "typescript/*.mjs", "typescript/package.json", "typescript/package-lock.json"]
